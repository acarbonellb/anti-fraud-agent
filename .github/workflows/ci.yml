name: CI

# Runs on every PR and on every push to `main` (after a squash, the push run
# is the only one that tests the real merged code). A manual run is there for
# the secret scan: on that event gitleaks scans the whole history, not a range.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The event is in the key so a manual scan on `main` and a push run (with
# its deploy) never cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action is pinned to a commit SHA, with its release in a comment: a tag
# can be moved, and the deploy job hands these actions the deploy identity
# (ADR 0018, amendment of #85). Dependabot moves the pins through PRs.
jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # On PRs the action lists the PR's commits through the API to scan them.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Full history so gitleaks scans every commit of the PR, not just the tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Format · Lint · Types · Tests · Commits
    # A manual run is only for the full-history secret scan.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # pnpm before setup-node so the node cache uses pnpm's store; the
      # version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      # TZ is forced to UTC by vitest.config.ts, not by the runner's default.
      - name: Tests
        run: pnpm test
      # Replays the recorded model responses through the real agent: no model,
      # no network, no cost. Fails on stale recordings, auto-approved fraud
      # among the gated cases, metrics the history doesn't hold, a history
      # entry with no experiment section, or an evals/report.md that no longer
      # matches.
      - name: Offline evals
        run: pnpm eval:replay --check
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  # Deploys the pass to its Cloud Run Job (ADR 0018) once both checks pass on
  # main. No stored key: GitHub's OIDC token is exchanged through Workload
  # Identity Federation, whose provider accepts only this repository on main.
  # Skipped until the setup script has set the repository variables.
  deploy:
    name: Deploy the pass
    needs: [secrets, quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGION: europe-west1
      IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/agent/pass:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build and push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      # The job's whole configuration is here, so a change to the model, the
      # effort or the budget is reviewed in a PR (ADR 0008, amendment of #42).
      # `--paid` is the go-ahead to call a paid provider. Satella's origin and
      # audience aren't credentials, but they are secrets so the staging host
      # stays out of these logs, which are public (ADR 0018, amendment of #9).
      - name: Point the job at it
        run: |
          gcloud run jobs update pass --region="$REGION" --quiet \
            --image="$IMAGE" \
            --args=--paid \
            --set-env-vars="AGENT_LLM_PROVIDER=anthropic,AGENT_LLM_MODEL=claude-haiku-5-5,AGENT_LLM_EFFORT=medium,AGENT_DAILY_BUDGET_MICROS=2000000,FIRESTORE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}" \
            --set-secrets="AGENT_LLM_API_KEY=AGENT_LLM_API_KEY:latest,TAVILY_API_KEY=TAVILY_API_KEY:latest,SATELLA_STAGING_BASE_URL=SATELLA_STAGING_BASE_URL:latest,SATELLA_AGENT_API_AUDIENCE=SATELLA_AGENT_API_AUDIENCE:latest"
